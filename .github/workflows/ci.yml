name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-hygiene:
    name: Nothing of value is tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secrets, photos, and infrastructure identifiers
        run: bash scripts/check-no-secrets.sh

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --if-present
      # No test script until Phase 1, which starts with computeProgress() and
      # its unit tests. --if-present keeps this honest rather than green-by-stub.
      - run: npm run test --if-present
