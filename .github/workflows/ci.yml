name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-hygiene:
    name: Nothing of value is tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secrets, photos, and infrastructure identifiers
        env:
          # Site-specific identifiers, one regex per line. Optional: the
          # generic checks run either way.
          EXTRA_SECRET_PATTERNS: ${{ secrets.EXTRA_SECRET_PATTERNS }}
        run: bash scripts/check-no-secrets.sh

      # Invoked directly rather than via gitleaks-action, which scans the range
      # <first-commit>^..HEAD and therefore fails on the very first push: the
      # root commit has no parent. Scanning the checked-out tree is also what
      # we actually want -- the question is what the repo contains now.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose --exit-code 1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Every venue's coordinates must land inside the state its record claims.
      # Cheap, and it catches a transposed sign before it reaches the map.
      - run: npm run check:coords
