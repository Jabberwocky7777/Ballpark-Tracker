name: Build and push image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image must never contain a secret, a photo, or a .env. Everything
      # arrives as runtime env from the app wizard. This gate runs before the
      # build so a bad layer is never published.
      - name: Check for secrets, photos, and infrastructure identifiers
        run: bash scripts/check-no-secrets.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-spike
            type=sha,format=short,suffix=-spike

      # Phase 0: the spike target is what gets published, because the runner
      # stage has no app in it yet. Phase 1 switches this to `runner` and
      # restores the semver tags.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: spike
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: How to run the spike
        run: |
          echo "Pull on a machine with Docker and real photos, then:"
          echo "  docker run --rm -v /path/to/photos:/in:ro \\"
          echo "    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-spike /in"
