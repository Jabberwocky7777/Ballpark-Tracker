name: Build and push image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image must never contain a secret, a photo, or a .env. Everything
      # arrives as runtime env from the app wizard. This gate runs before the
      # build so a bad layer is never published.
      - name: Check for secrets, photos, and infrastructure identifiers
        env:
          EXTRA_SECRET_PATTERNS: ${{ secrets.EXTRA_SECRET_PATTERNS }}
        run: bash scripts/check-no-secrets.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            # `latest` is what anyone typing a tag by hand will reach for, and
            # an image without it fails to pull with a confusing "manifest
            # unknown" rather than anything that names the real problem.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Phase 0 harness ships as its own tag so it can be run against real
      # photos without pulling the app image.
      - id: meta-spike
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-spike
            type=sha,format=short,suffix=-spike

      - name: Build and push the spike image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: spike
          push: true
          tags: ${{ steps.meta-spike.outputs.tags }}
          labels: ${{ steps.meta-spike.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
